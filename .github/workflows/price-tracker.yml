name: Price Tracker

on:
  workflow_dispatch:
  schedule:
    # Un controllo al giorno a mezzogiorno UTC (13:00 CET / 14:00 CEST).
    - cron: '0 12 * * *'

# Impedisce run simultanee; l'annullamento non rimborsa le chiamate API già effettuate.
concurrency:
  group: price-tracker
  cancel-in-progress: true

# Permessi minimi per il GITHUB_TOKEN: al workflow serve solo leggere il codice.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

  check-prices:
    runs-on: ubuntu-latest
    needs: test
    # 'actions: write' serve per scaricare/caricare l'artifact dello stato
    # (dedup degli alert): senza questo permesso l'upload dell'artifact
    # verrebbe rifiutato dal workflow con 'permissions' ristretti.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download previous state
        uses: actions/download-artifact@v4
        with:
          name: price-tracker-state
          path: ./
        continue-on-error: true

      - name: Run price tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
          PRICE_STATE_FILE: state.json
        run: |
          python main.py

      # Persisto lo stato delle notifiche tra una run e l'altra (dedup alert).
      # L'upload gira anche se la run fallisce, così lo stato non va perso.
      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-tracker-state
          path: state.json
          if-no-files-found: ignore
          overwrite: true
