name: Price Tracker

on:
  workflow_dispatch:
  schedule:
    # Tre controlli al giorno in fascia diurna: 9, 15 e 21 UTC.
    # In Italia (CET/CEST) equivalgono a 10/11-16/17-22/23 locali,
    # quindi la notte (00-08) resta coperta dalla sospensione.
    - cron: '0 9,15,21 * * *'

# Impedisce che più run si sovrappongano: se parte una nuova esecuzione
# mentre una è già in corso, quella in corso viene annullata. Evita
# chiamate API duplicate (ogni run consuma 1 credito ScraperAPI per prodotto).
concurrency:
  group: price-tracker
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

  check-prices:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
        run: |
          python main.py
